<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityScope</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <div id="map"></div>

    <div class="search-container">
        <input
            id="city-search"
            type="text"
            placeholder="Search for a city..."
            autocomplete="off"
        >

        <div id="search-results"></div>
    </div>

    <aside id="city-panel" class="city-panel hidden">
        <button id="close-panel" class="close-button">×</button>

        <h2 id="city-name">City</h2>
        <p id="city-location">State</p>

        <div class="stats">
            <div class="stat">
                <span>Population</span>
                <strong id="population">—</strong>
            </div>

            <div class="stat">
                <span>Median Age</span>
                <strong id="median-age">—</strong>
            </div>

            <div class="stat">
                <span>Median Home Price</span>
                <strong id="home-price">—</strong>
            </div>

            <div class="stat">
                <span>Unemployment</span>
                <strong id="unemployment">—</strong>
            </div>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="static/js/app.js"></script>

</body>
</html>
